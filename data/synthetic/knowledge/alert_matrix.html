<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Alert Matrix</title></head>
  <body>
    <h1>Alert Matrix</h1>
    <p>The matrix maps synthetic alert classes to controls.</p>
    <table>
      <thead>
        <tr><th>Alert class</th><th>Status</th><th>Control type</th></tr>
      </thead>
      <tbody>
        <tr><td>Concentration</td><td>Open</td><td>Manual review</td></tr>
        <tr><td>Regional</td><td>Scoped</td><td>Jurisdiction check</td></tr>
        <tr><td>Technical</td><td>Escalate</td><td>Service desk</td></tr>
      </tbody>
    </table>
  </body>
</html>
