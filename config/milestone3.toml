[base]
config = "config/milestone2.toml"

[extension]
evaluation_cases = "data/synthetic/m3/evaluation_cases.json"
network_edges = "data/synthetic/m3/network_edges.json"
generated_root = "data/generated/m3"

[routing]
top_k = 3
person_min_score = 0.70
person_min_margin = 0.10
functional_queue_confidence = 0.50
renormalize_applicable_weights = true
tie_breaker = "SCORE_DESC_MANDATE_SPECIFICITY_DESC_EXPERT_ID_ASC"
reference_time_utc = "2026-08-25T12:00:00Z"
confidence_kind = "DETERMINISTIC_ROUTING_HEURISTIC_V1"

[routing.weights]
expertise_match = 0.50
context_specificity = 0.20
system_match = 0.10
network_proximity = 0.10
capacity_score = 0.10

[routing.profiles.default]
support_model = "data/synthetic/m3/support_model_v1.json"
expert_directory = "data/synthetic/m3/expert_profiles_v1.json"

[routing.profiles.capacity_stress]
support_model = "data/synthetic/m3/support_model_v1.json"
expert_directory = "data/synthetic/m3/expert_profiles_capacity_stress.json"

[routing.profiles.support_v2]
support_model = "data/synthetic/m3/support_model_v2.json"
expert_directory = "data/synthetic/m3/expert_profiles_v2.json"

[evaluation]
expected_m0_cases = 5
expected_m1_new_cases = 7
expected_m2_new_cases = 8
expected_m3_new_cases = 8
expected_aggregate_cases = 28

[security]
network_enabled = false
