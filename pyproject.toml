[project]
name = "riskon"
version = "0.1.0"
description = "Local-first synthetic prototype for RiskON 2026 Challenge 1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0,<5.0.0",
    "defusedxml>=0.7.1,<0.8.0",
    "fastapi>=0.115.0,<1.0.0",
    "lxml>=6.1.2,<7.0.0",
    "openai>=1.0,<2.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "scikit-learn>=1.9.0,<2.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.scripts]
riskon = "riskon.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-socket>=0.8.1,<0.9.0",
    "python-pptx>=1.0.2",
    "ruff>=0.16.4,<0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/riskon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket"

[tool.coverage.run]
branch = true
source = ["src/riskon"]
